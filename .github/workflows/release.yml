name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run a release for an existing tag with this workflow, e.g. when a tag's
  # own run got stuck. Builds from the tag, not from main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.12.0-beta"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:

  # ── Per-architecture container builds ──────────────────────────────────────
  # Each architecture builds on its own native runner. Building arm64 under
  # QEMU emulation took up to hours (npm install in the web image hung), so
  # every job also has a hard timeout instead of GitHub's 6-hour default.
  build-images:
    name: Build ${{ matrix.component.name }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: talepanel-api
            context: services/api
            target: production
          - name: talepanel-web
            context: apps/web
            target: ""
          - name: talepanel-daemon
            context: services/daemon
            target: ""
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.component.name }}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.context }}/Dockerfile
          target: ${{ matrix.component.target }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.arch.name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Multi-arch manifests ───────────────────────────────────────────────────
  merge-images:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    needs: build-images
    timeout-minutes: 15
    strategy:
      matrix:
        component: [talepanel-api, talepanel-web, talepanel-daemon]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push tags
        working-directory: /tmp/digests
        run: |
          # CHANGELOG headings have no leading "v": "## [0.10.0-beta] — date".
          TAG="${RELEASE_TAG#v}"
          MINOR="${TAG%.*}"
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${MINOR}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # ── Installer checksums and GitHub Release ────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: merge-images
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Generate installer checksums
        run: |
          cd scripts
          sha256sum install.sh > install.sh.sha256
          sha256sum lib/common.sh > lib/common.sh.sha256

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Tags are "v0.10.0-beta", CHANGELOG headings "## [0.10.0-beta] — date".
          TAG="${RELEASE_TAG#v}"
          # Extract the section for this version — between the matching H2
          # heading and the next H2 heading.
          awk -v tag="$TAG" '
            /^## / { if (seen) exit; if (index($0, "[" tag "]")) { seen=1; next } }
            seen { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            scripts/install.sh
            scripts/install.sh.sha256
            scripts/lib/common.sh
            scripts/lib/common.sh.sha256
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
