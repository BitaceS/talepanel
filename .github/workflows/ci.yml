name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Go API ─────────────────────────────────────────────────────────────────
  go-api:
    name: Go API — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./... -short -v

  # ── Rust daemon ────────────────────────────────────────────────────────────
  rust-daemon:
    name: Rust daemon — build + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/daemon
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/daemon

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build
        run: cargo build --release --locked

  # ── Nuxt web panel ─────────────────────────────────────────────────────────
  web-panel:
    name: Nuxt web panel — build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── End-to-end tests (Playwright against the Docker demo) ──────────────────
  e2e:
    name: E2E — Playwright on the demo stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEMO: examples/demo/compose.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start the demo stack
        run: docker compose -f "$DEMO" up -d --build

      - name: Wait for the seed
        run: |
          for _ in $(seq 1 120); do
            state=$(docker compose -f "$DEMO" ps -a --format '{{.State}}' seed)
            [ "$state" = "exited" ] && break
            sleep 5
          done
          code=$(docker compose -f "$DEMO" ps -a --format '{{.ExitCode}}' seed)
          docker compose -f "$DEMO" logs seed
          if [ "$state" != "exited" ] || [ "$code" != "0" ]; then
            echo "seed did not finish (state=$state exit=$code)"; exit 1
          fi

      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: apps/web
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: docker compose -f "$DEMO" logs --no-color > demo-logs.txt

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            demo-logs.txt
          retention-days: 14

  # ── Installer scripts ──────────────────────────────────────────────────────
  shellcheck:
    name: Bash installers — shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          severity: warning

  # ── Container image vulnerability scan ─────────────────────────────────────
  trivy:
    name: Trivy — scan API image
    runs-on: ubuntu-latest
    needs: go-api
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t talepanel-api:ci --target production services/api

      - name: Trivy scan (report only, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: talepanel-api:ci
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
